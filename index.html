<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO Store</title>

    <style>
        /* ============ COMMON ============ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: #f2f4f7;
        }

        /* ============ SPLASH ============ */

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 999;
        }

        #logo {
            width: 260px;
            animation: zoomIn 2s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(.2);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        #authBtns {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: 1s;
        }

        #authBtns.show {
            opacity: 1;
            transform: translateY(0);
        }

        #authBtns button {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            margin: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginBox {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            width: 330px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, .4);
            text-align: center;
            display: none;
        }

        #loginBox input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #loginBox button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ============ MAIN ============ */

        #mainApp {
            display: none;
        }

        /* Header */

        header {
            background: #0a2a66;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        header input {
            padding: 8px;
            border-radius: 5px;
            border: none;
            width: 220px;
        }

        header button {
            padding: 7px 12px;
            border: none;
            background: orange;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }

        /* Pages */

        .page {
            display: none;
            padding: 20px;
        }

        .active {
            display: block;
        }

        /* ============ PRODUCTS ============ */

        #products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
            transition: .3s;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: contain
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card select,
        .card button {
            width: 100%;
            padding: 7px;
            margin-top: 5px
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: contain;
        }


        /* ============ ACCOUNT ============ */

        .account-box {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
            text-align: center;
        }

        .account-box img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2563eb;
        }

        .account-box input,
        .account-box textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .account-box button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* ============ DISTRIBUTOR ============ */

        .distributor-box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, .2);
        }

        .distributor-box h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        .dist-item {
            margin: 10px 0;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 6px;
        }

        /* ============ MODAL ============ */

        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #modalBox {
            background: white;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        #modalBox img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        #modalBox button {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            background: red;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Cart */
        #cartBox {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px
        }

        .cartItem {
            display: flex;
            justify-content: space-between;
            margin: 6px 0
        }
    </style>
</head>

<body>

    <!-- SPLASH -->

    <div id="splash">

        <img src="LEO logo.png" id="logo">

        <div id="authBtns">
            <button onclick="openForm(true)">Login</button>
            <button onclick="openForm(false)">Sign Up</button>
        </div>

        <div id="loginBox">

            <h3 id="formTitle">Login</h3>

            <input id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">

            <button onclick="doLogin()">Submit</button>

        </div>
    </div>

    <!-- MAIN -->

    <div id="mainApp">

        <header>

            <h2>LEO Store</h2>

            <input id="search" placeholder="Search..." onkeyup="searchProduct()">

            <div>
                <span id="userName"></span>

                <button onclick="showHome()">Home</button>
                <button onclick="showAccount()">Account</button>
                <button onclick="showDistributor()">Distributor</button>
                <button onclick="logout()">Logout</button>

            </div>

        </header>

        <!-- HOME -->

        <div id="home" class="page active">

            <div id="home" class="page active">

                <h2>Products</h2>

                <!-- PLACE ORDER BUTTON ADD HERE -->
                <button onclick="placeOrder()"
                    style="margin:10px 0;padding:8px 15px;background:green;color:white;border:none;border-radius:5px;cursor:pointer;">
                    Place Order
                </button>

                <div id="products"></div>

            </div>


        </div>

        <!-- ACCOUNT -->

        <div id="account" class="page">

            <div class="account-box">

                <h3>My Account</h3>

                <img id="profilePic" src="https://via.placeholder.com/120">

                <input type="file" onchange="uploadPic(this)">

                <input id="accName" placeholder="Full Name">
                <input id="accPhone" placeholder="Phone">
                <input id="accShop" placeholder="Shop">

                <textarea id="accAddress" placeholder="Address"></textarea>

                <button onclick="saveAccount()">Save / Update</button>
                <hr style="margin:15px 0;">

                <h4>Previous Orders</h4>
                <div id="orderHistory"></div>


            </div>

        </div>

        <!-- DISTRIBUTOR -->

        <div id="distributor" class="page">

            <div class="distributor-box">

                <h3>Distributor Details</h3>

                <div class="dist-item"><b>Name:</b> NAGARJUNA REDDY</div>
                <div class="dist-item"><b>Phone:</b> 8712344994</div>
                <div class="dist-item"><b>Email:</b> nagarjunabandreddy@gmail.com</div>
                <div class="dist-item"><b>Address:</b><br>
                    52/113-B, Kothapeta Ramapuram<br>
                    Rayachoty - 516269<br>
                    Annamayya dt, A.P
                </div>

            </div>

        </div>

    </div>

    <!-- PRODUCT MODAL -->

    <div id="modal">

        <div id="modalBox">

            <img id="mImg">
            <h3 id="mName"></h3>
            <p id="mPrice"></p>

            <button onclick="closeModal()">Close</button>

        </div>

    </div>

    <script>

        /* Splash */
        setTimeout(() => {
            authBtns.classList.add("show");
        }, 2000);

        /* Login */
        let currentUser = "";

        function openForm(l) {
            formTitle.innerText = l ? "Login" : "Sign Up";
            loginBox.style.display = "block";
        }

        function doLogin() {

            if (!username.value || !password.value) {
                alert("Fill all fields");
                return;
            }

            currentUser = username.value;
            localStorage.setItem("leoUser", currentUser);

            splash.style.display = "none";
            mainApp.style.display = "block";
            userName.innerText = "Hi, " + currentUser;
        }

        /* Logout */
        function logout() {
            localStorage.removeItem("leoUser");
            location.reload();
        }

        /* ================= PRODUCTS ================= */

        const products = [
            { name: "2 Way Angle Valve", price: 419, img: "images/2_way_angle_valve.png" },
            { name: "2 Way Tap Plain", price: 450, img: "images/2_way_tap.png" },
            { name: "2 Way Tap Brass", price: 470, img: "images/2_way_tap_white.png" },
            { name: "20mm Bib Tap Red", price: 216, img: "images/20MM_Bib_tap.png" },
            { name: "20mm Bib Tap Black", price: 205, img: "images/20mm_bib_tap_black.png" },
            { name: "Angle Valve", price: 235, img: "images/Angle_Valve.png" },
            { name: "Angle Valve T", price: 120, img: "images/Angle_valve_T.png" },
            { name: "Bib Tap Angular", price: 221, img: "images/bib_tap.png" },
            { name: "Bib Tap Black", price: 160, img: "images/bib_tap_black.png" },
            { name: "Bib Tap Classic", price: 171, img: "images/bib_tap_classic.png" },
            { name: "Bib Tap T", price: 120, img: "images/Bib_tap_T.png" },
            { name: "Brass insert", price: 200, img: "images/brass.png" },
            { name: "Garden Tap", price: 160, img: "images/garden_tap.png" },
            { name: "Long Body Classic", price: 261, img: "images/long_body_classic.png" },
            { name: "M&M Valve", price: 140, img: "images/M&M_valve.png" },
            { name: "Piller Tap", price: 235, img: "images/Piller_Tap.png" },
            { name: "Piller Tap Premium", price: 250, img: "images/Piller_Tap_Premium.png" },
            { name: "Piller Tap Swan Neck", price: 477, img: "images/piller_tap_swan_neck.png" },
            { name: "Push Tap", price: 140, img: "images/push_tap.png" },
            { name: "Wall Sink Tap", price: 563, img: "images/sink_tap.png" },
            { name: "Sink Tap Table", price: 572, img: "images/Sink_tap_table.png" },
            { name: "Wall Mixer", price: 1551, img: "images/wall_mixer.png" },
            { name: "Washing Machine Tap", price: 288, img: "images/washing_machine_tap.png" },
            {
                name: "Level Tube",
                img: "images/Level_tube.png",
                sizes: { "1 Meter": 120, "1.5 Meter": 170, "2 Meter": 220 }
            },
            {
                name: "Garden Hose",
                img: "images/Garden_hose.png",
                sizes: { "1 Meter": 150, "1.5 Meter": 210, "2 Meter": 270 }
            }
        ];

        const productDiv = document.getElementById("products");
        const home = document.getElementById("home");
        const account = document.getElementById("account");
        const distributor = document.getElementById("distributor");

        let cart = JSON.parse(localStorage.getItem("leoCart")) || [];
        let orders = JSON.parse(localStorage.getItem("leoOrders")) || [];

        /* Load Products */
        function loadProducts(list) {

            productDiv.innerHTML = "";

            list.forEach((p, index) => {

                let price = p.price ? p.price : Object.values(p.sizes)[0];
                let sizeHTML = "";

                if (p.sizes) {
                    sizeHTML = `
            <select onchange="changePrice(${index},this)">
            ${Object.entries(p.sizes).map(([s, pr]) =>
                        `<option value="${pr}">${s}</option>`
                    ).join("")}
            </select>`;
                }

                const div = document.createElement("div");
                div.className = "card";

                div.innerHTML = `
        <img src="${p.img}" onclick="openModal('${p.img}','${p.name}','${price}')">
        <h4>${p.name}</h4>
        <p>₹ <span id="price${index}">${price}</span></p>
        ${sizeHTML}
        <input type="number" id="qty${index}" min="1" value="1" style="width:100%;padding:6px;margin-top:5px;">
        <button onclick="addToCart(${index})">Add to Cart</button>
        `;

                productDiv.appendChild(div);
            });
        }

        loadProducts(products);

        function changePrice(index, select) {
            document.getElementById("price" + index).innerText = select.value;
        }

        /* Add to Cart */
        function addToCart(index) {

            let product = products[index];
            let price = product.price;
            let size = "Standard";

            if (product.sizes) {
                const select = document.querySelectorAll("select")[index];
                price = Number(select.value);
                size = select.options[select.selectedIndex].text;
            }

            let qty = Number(document.getElementById("qty" + index).value);

            cart.push({
                name: product.name,
                size: size,
                price: price,
                qty: qty,
                total: price * qty
            });

            localStorage.setItem("leoCart", JSON.stringify(cart));
            alert("Added to Cart");
        }

        /* Place Order */
        function placeOrder() {

            if (cart.length === 0) {
                alert("Cart is Empty");
                return;
            }

            let total = cart.reduce((sum, item) => sum + item.total, 0);

            let orderDate = new Date();
            let deliveryDate = new Date();
            deliveryDate.setDate(orderDate.getDate() + 5);

            let order = {
                items: cart,
                total: total,
                orderDate: orderDate.toLocaleDateString(),
                deliveryDate: deliveryDate.toLocaleDateString()
            };

            orders.push(order);
            localStorage.setItem("leoOrders", JSON.stringify(orders));

            let message = `Hello Nagarjuna Reddy,%0A%0A`;
            message += `New Order from LEO Store%0A%0A`;
            message += `Customer: ${localStorage.getItem("leoUser")}%0A%0AItems:%0A`;

            cart.forEach((item, i) => {
                message += `${i + 1}) ${item.name} (${item.size}) - ₹${item.price} x ${item.qty} = ₹${item.total}%0A`;
            });

            message += `%0ATotal: ₹${total}%0A`;
            message += `Order Date: ${orderDate.toLocaleDateString()}%0A`;
            message += `Delivery Date: ${deliveryDate.toLocaleDateString()}%0A`;

            window.open(`https://wa.me/918712344994?text=${message}`, "_blank");

            cart = [];
            localStorage.setItem("leoCart", JSON.stringify(cart));

            alert("Order Placed Successfully!");
        }

        /* Navigation */
        function showHome() {
            home.classList.add("active");
            account.classList.remove("active");
            distributor.classList.remove("active");
        }

        function showAccount() {
            account.classList.add("active");
            home.classList.remove("active");
            distributor.classList.remove("active");
            loadOrderHistory();
        }

        function showDistributor() {
            distributor.classList.add("active");
            home.classList.remove("active");
            account.classList.remove("active");
        }

        /* Order History */
        function loadOrderHistory() {

            const box = document.getElementById("orderHistory");
            if (!box) return;

            box.innerHTML = "";

            if (orders.length === 0) {
                box.innerHTML = "<p>No previous orders.</p>";
                return;
            }

            orders.forEach((o, i) => {

                let div = document.createElement("div");

                div.style.border = "1px solid #ccc";
                div.style.margin = "10px 0";
                div.style.padding = "10px";
                div.style.borderRadius = "5px";
                div.style.background = "#f9fafb";

                div.innerHTML = `
            <b>Order ${i + 1}</b><br>
            Order Date: ${o.orderDate}<br>
            Delivery Date: ${o.deliveryDate}<br>
            <b>Total: ₹${o.total}</b><br><br>
            ${o.items.map(item =>
                    `${item.name} (${item.size}) - ₹${item.price} x ${item.qty} = ₹${item.total}`
                ).join("<br>")}
        `;

                box.appendChild(div);
            });
        }

        /* Auto Load */
        window.onload = function () {
            loadOrderHistory();
        };

    </script>
</body>

</html>
